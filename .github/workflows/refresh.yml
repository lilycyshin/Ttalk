# 실검·키워드별 뉴스를 1시간마다 서버에서 미리 새로 만들게 깨운다 (뉴스 RSS만 읽어서 비용 없음).
# Vercel 무료(Hobby) 플랜 Cron은 하루 1번만 돼서 GitHub Actions 스케줄로 부른다.
# 서버는 만든 지 50분 넘은 데이터를 받으면 그걸 먼저 주고 뒤에서 새로 만든다 (app/api/today, app/api/trends).
# 배포가 끝났을 때도 한 번 불러서, 배포 직후 첫 사용자가 기다리지 않게 한다.
name: refresh-data

on:
  schedule:
    - cron: "7 * * * *" # 매시 7분 (정시는 GitHub 스케줄이 많이 밀려서 피한다)
  deployment_status:
  workflow_dispatch:

jobs:
  warm:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 실검, 뉴스 풀 깨우기
        run: |
          for p in trends today; do
            curl -sS -o /dev/null -w "$p %{http_code} %{time_total}s\n" --max-time 310 \
              "https://dailysmalltalk.vercel.app/api/$p" || echo "$p failed"
          done
